plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm' version '2.0.20'  // Kotlin 插件（版本随意更新到最新稳定）
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
    mavenCentral()
    maven {
        url "https://maven.graalvm.org/maven"
    }

    maven { url = "https://repo.spongepowered.org/maven" }
    maven {
        url = "https://maven.midnightdust.eu/releases"
    }
    maven {
        url = "https://api.modrinth.com/maven"
    }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"worldgenpro" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Json 解析库
    implementation "com.google.code.gson:gson:2.10.1"

    //
    implementation "org.jgrapht:jgrapht-core:1.5.2"

    // 桥接组件
    implementation "org.graalvm.polyglot:polyglot:24.2.1"

    // JavaScript 脚本引擎依赖
    implementation "org.graalvm.js:js-community:24.2.1"
    implementation "org.graalvm.truffle:truffle-enterprise:24.2.1"

    // Java 动态编译依赖
    implementation "org.codehaus.janino:janino:3.1.12"
    implementation "org.codehaus.janino:commons-compiler:3.1.12"

    // Lua 脚本引擎依赖
    implementation "org.luaj:luaj-jse:3.0.1"

    // 配置文件库 (1)
    implementation("com.electronwill.night-config:core:3.6.7")
    implementation("com.electronwill.night-config:toml:3.6.7")

    // debug 工具
    implementation 'org.openjdk.jol:jol-core:0.17'

    // 配置文件库 (2) 使用include包含
    modImplementation include ("maven.modrinth:midnightlib:${project.midnightlib_version}")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

kotlin {
    jvmToolchain(21) // 使用 Java 21
}

loom {
    accessWidenerPath = file("src/main/resources/worldgenpro.accesswidener")
}


java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}